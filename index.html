<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="Screenshot 2025-05-20 072809.png" type="image/x-icon" />
        <title>El Pollo Loco</title>
        <link rel="stylesheet" href="style.css" />
        <!-- Deine Skripte -->
        <script src="models/Hub.class.js"></script>
        <script src="models/drawableObject.class.js"></script>
        <script src="models/moveable-object.class.js"></script>
        <script src="models/consumable-object.class.js"></script>
        <script src="models/character.class.js"></script>
        <script src="models/Chicken.class.js"></script>
        <script src="models/cloud.class.js"></script>
        <script src="models/status-bar.class.js"></script>
        <script src="models/hp-bar.class.js"></script>
        <script src="models/coin-bar.class.js"></script>
        <script src="models/salsa-bar.class.js"></script>
        <script src="models/endboss-bar.class.js"></script>
        <script src="models/throwable-salsa.class.js"></script>
        <script src="models/background-object.class.js"></script>
        <script src="models/salsa-bottle.class.js"></script>
        <script src="models/coin.class.js"></script>
        <script src="models/keyboard.class.js"></script>
        <script src="models/level.class.js"></script>
        <script src="models/endboss.class.js"></script>
        <script src="models/world.class.js"></script>
        <script src="scripts/game.js"></script>
        <script src="scripts/script.js"></script>
    </head>
    <body>
        <!-- Rotate Overlay für Mobile -->
        <div class="rotate-overlay d_none">
            <div class="rotate-icon">📱</div>
            <div class="rotate-text">Bitte drehe dein Gerät</div>
            <div>Für das beste Spielerlebnis spiele im Querformat</div>
        </div>

        
        <main>
            <!-- Audio Controls -->
            <div class="audio-controls">
                <!-- Desktop Volume Slider -->
                <div class="volume-control desktop-only">
                    <input type="range" id="volumeSlider" min="0" max="100" value="50" class="volume-slider">
                    <span class="volume-label">🔊</span>
                </div>
                
                <!-- Mobile Mute/Loud Toggle -->
                <button class="audio-toggle mobile-only" id="audioToggle">
                    <span id="audioIcon">🔊</span>
                </button>
            </div>

            <!-- Mobile Controls -->
            <div class="mobile-controls ">
                <div class="controls-left">
                    <button class="control-btn control-left" id="leftBtn"><</button>
                    <button class="control-btn control-right" id="rightBtn">></button>
                </div>
                <div class="controls-right">
                    <button class="control-btn control-jump" id="jumpBtn">Jump</button>
                    <button class="control-btn control-throw" id="throwBtn">atk</button>
                </div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="canvas" width="720" height="480"></canvas>
            </div>

            <div class="Keybinds">
                <div>
                    <strong>Steuerung:</strong><br />
                    <span>Spacebar - Jump</span><br />
                    <span>← / A - Laufen nach links</span><br />
                    <span>→ / D - Laufen nach rechts</span><br />
                    <span>C - Flasche werfen</span>
                </div>
            </div>

            <div class="start-area">
                <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="" />
                <button class="startbutton" onclick="startGame()">Start</button>
            </div>

            <div class="loosing-area d_none">
                <img class="uLost" src="img/You won, you lost/You lost b.png" alt="" />
                <img class="background" src="img/5_background/first_half_background.png" alt="" />
                <button class="restart-button" onclick="startAgain()">Restart</button>
                <button class="end-button" onclick="endGame()">Ende</button>
            </div>

            <div class="winning-area d_none">
                <img class="uWon" src="img/You won, you lost/You Win A.png" alt="" />
                <img class="background" src="img/5_background/first_half_background.png" alt="" />
                <button class="end-button-w" onclick="endGame()">Ende</button>
            </div>
        </main>
    </body>
</html>
